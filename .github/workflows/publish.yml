name: Publish Packages

# Publishes via npm trusted publishing (OIDC): no long-lived npm token needed.
# Each package must have a trusted publisher configured on npmjs.com:
#   Package -> Settings -> Trusted publishing -> GitHub Actions
#   org: esimplicityinc  repo: katalyst-bdd-test  workflow: publish.yml
#   allowed actions: npm publish
# If OIDC isn't configured for a package (e.g. its very first publish, before a
# trusted publisher can be added), npm falls back to secrets.NPM_TOKEN.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@latest
          npm --version

      # The lockfile is generated on macOS and lacks Linux-only optional native
      # binaries (e.g. @rollup/rollup-linux-x64-gnu), so `npm ci` can't be used.
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build packages
        run: npm run build

      - name: Test packages
        run: npm test

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for dir in stack-tests create-stack-tests; do
            PACKAGE_NAME=$(node -p "require('./$dir/package.json').name")
            PACKAGE_VERSION=$(node -p "require('./$dir/package.json').version")

            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published to npm, skipping."
            elif [ "${DRY_RUN}" == "true" ]; then
              echo "DRY RUN: Would publish ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
              (cd "$dir" && npm publish --access public --dry-run)
            else
              echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
              (cd "$dir" && npm publish --access public)
            fi
          done
