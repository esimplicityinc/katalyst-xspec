name: Publish Packages

# Publishes @esimplicitylabs/katalyst-xspec (library + CLI) to npmjs.com using
# npm trusted publishing (OIDC). No npm token is stored.
#
# One-time setup on npmjs.com (package -> Settings -> Trusted publishing):
#   Publisher: GitHub Actions
#   Organization: esimplicityinc   Repository: katalyst-xspec
#   Workflow filename: publish.yml  Environment: (blank)
#   Allowed actions: npm publish
# A trusted publisher can only be added to a package that already exists, so
# the very first version must be published manually (`npm publish --access public`).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@latest
          npm --version

      # The lockfile is generated on macOS and lacks Linux-only optional native
      # binaries (e.g. @rollup/rollup-linux-x64-gnu), so `npm ci` can't be used.
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build packages
        run: npm run build

      - name: Test packages
        run: npm test

      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for dir in katalyst-xspec; do
            PACKAGE_NAME=$(node -p "require('./$dir/package.json').name")
            PACKAGE_VERSION=$(node -p "require('./$dir/package.json').version")

            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published, skipping."
            elif [ "${DRY_RUN}" == "true" ]; then
              echo "DRY RUN: Would publish ${PACKAGE_NAME}@${PACKAGE_VERSION}"
              (cd "$dir" && npm publish --access public --dry-run)
            else
              echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"
              (cd "$dir" && npm publish --access public)
            fi
          done
