name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build packages
        run: npm run build

      - name: Publish stack-tests to npm
        working-directory: stack-tests
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          # Check if version already exists
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "Version ${PACKAGE_VERSION} already published to npm, skipping."
          elif [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "DRY RUN: Would publish ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
            npm publish --access public --dry-run
          else
            echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-stack-tests to npm
        working-directory: create-stack-tests
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          # Check if version already exists
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "Version ${PACKAGE_VERSION} already published to npm, skipping."
          elif [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "DRY RUN: Would publish ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
            npm publish --access public --dry-run
          else
            echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION} to npm"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
