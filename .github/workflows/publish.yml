name: Publish Packages

# Publishes @esimplicityinc/katalyst-xspec and @esimplicityinc/create-katalyst-xspec
# to GitHub Packages (npm.pkg.github.com) using the built-in GITHUB_TOKEN.
# No npm account or stored secret is needed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@esimplicityinc'

      # The lockfile is generated on macOS and lacks Linux-only optional native
      # binaries (e.g. @rollup/rollup-linux-x64-gnu), so `npm ci` can't be used.
      # Dependencies come from npmjs.com; only the @esimplicityinc scope is
      # routed to GitHub Packages.
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: npm run build

      - name: Test packages
        run: npm test

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for dir in katalyst-xspec create-katalyst-xspec; do
            PACKAGE_NAME=$(node -p "require('./$dir/package.json').name")
            PACKAGE_VERSION=$(node -p "require('./$dir/package.json').version")

            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published, skipping."
            elif [ "${DRY_RUN}" == "true" ]; then
              echo "DRY RUN: Would publish ${PACKAGE_NAME}@${PACKAGE_VERSION}"
              (cd "$dir" && npm publish --dry-run)
            else
              echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"
              (cd "$dir" && npm publish)
            fi
          done
